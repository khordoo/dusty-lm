<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DustyLM — Milo rename</title>
<style>
  html,body{margin:0;background:#030406;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const D = /*__DATA__*/;

const BG = '#030406', SILVER = '#cdd7ec', MUTED = '#6f7a8c',
      EMB = '#ff8a3d', HOT = '#fff0dc', GOLD = '#ffb547';
const MONO = '"Menlo","SF Mono",ui-monospace,monospace';
const TOTAL = 12.0;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const fade = (t, a, d = .3) => clamp((t - a) / d);
const typed = (s, t, cps) => s.slice(0, Math.max(0, Math.floor(t * cps)));

function hex(c) {
  const n = parseInt(c.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(a, b, t) {
  const A = hex(a), B = hex(b);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
}
function heatColor(v) {
  if (v < 0.62) return mix('#07090d', '#ff8a3d', v / 0.62);
  return mix('#ff8a3d', '#fff0dc', (v - 0.62) / 0.38);
}
function text(s, x, y, size, color, a = 1, weight = 400, align = 'left') {
  g.save();
  g.globalAlpha = a;
  g.fillStyle = color;
  g.font = `${weight} ${size}px ${MONO}`;
  g.textAlign = align;
  g.fillText(s, x, y);
  g.restore();
}
function caret(x, y, size, t, a = 1) {
  if (Math.floor(t * 2.5) % 2 === 0) {
    g.save(); g.globalAlpha = a; g.fillStyle = EMB;
    g.fillRect(x + 2, y - size * .78, size * .48, size * .9);
    g.restore();
  }
}
function rule(x, y, w, color, a = 1) {
  g.save(); g.globalAlpha = a; g.fillStyle = color; g.fillRect(x, y, w, 2); g.restore();
}

/* ---------------- scene 1: the write lands ---------------- */
function sceneLayers(t) {
  const cmd = '\u0394W = \u03c3\u2081 u\u2081v\u2081\u1d40 + \u03c3\u2082 u\u2082v\u2082\u1d40';
  const c = typed(cmd, t - .12, 42);
  text(c, 120, 96, 30, SILVER, 1, 600);
  if (t < 1.1) caret(120, 96, 30, t);
  if (t > 1.0) text('closed form \u00b7 no gradients \u00b7 one tensor', 120, 140, 22, MUTED, fade(t, 1.0));
  if (t > 1.4) {
    text('262,144 values changed', W - 120, 96, 26, GOLD, fade(t, 1.4), 600, 'right');
    text('1 of 51 tensors', W - 120, 132, 20, MUTED, fade(t, 1.4), 400, 'right');
  }

  const n = 8, x0 = 140, x1 = W - 140, gap = (x1 - x0) / n, sw = 116;
  const top = 300, bot = 880, slabH = bot - top;
  const rows = D.grid.rows, cols = D.grid.cols;

  for (let l = 0; l < n; l++) {
    const lay = D.layers[l];
    const cx = x0 + gap * (l + .5);
    const edited = lay.d !== null;
    const wave = edited ? clamp((t - 1.02) / .55) : 0;

    if (edited && wave > 0) {
      const gr = g.createRadialGradient(cx, top + slabH / 2, 10, cx, top + slabH / 2, 260);
      gr.addColorStop(0, `rgba(255,138,61,${.16 * wave})`);
      gr.addColorStop(1, 'rgba(255,138,61,0)');
      g.fillStyle = gr;
      g.fillRect(cx - 280, top - 120, 560, slabH + 240);
    }

    g.fillStyle = 'rgba(20,26,36,0.32)';
    g.fillRect(cx - sw / 2, top, sw, slabH);
    g.strokeStyle = edited ? `rgba(255,138,61,${.22 + .5 * wave})` : 'rgba(120,135,160,0.16)';
    g.lineWidth = edited ? 2 : 1;
    g.strokeRect(cx - sw / 2, top, sw, slabH);

    const dx = sw / (cols + 1), dy = slabH / (rows + 1);
    for (let r = 0; r < rows; r++) {
      for (let q = 0; q < cols; q++) {
        const k = r * cols + q;
        const x = cx - sw / 2 + dx * (q + 1);
        const y = top + dy * (r + 1);
        const base = Math.min(1, lay.w[k] * 1.5) * .52;
        g.fillStyle = `rgba(205,215,236,${base})`;
        g.fillRect(x, y, 2.7, 2.7);
        if (edited) {
          const dv = lay.d[k] * wave;
          if (dv > .035) {
            const a = Math.min(1, dv * 1.9);
            g.fillStyle = `rgba(255,${Math.round(118 + 70 * a)},${Math.round(48 + 50 * a)},${a * .92})`;
            g.fillRect(x - 1.3, y - 1.3, 5.0, 5.0);
          }
        }
      }
    }

    text(String(l), cx, bot + 42, 19, edited && t > 1.25 ? GOLD : MUTED, 1, edited ? 700 : 400, 'center');
    if (edited && t > 1.25) text('edited', cx, bot + 68, 14, EMB, fade(t, 1.25), 600, 'center');
  }

  if (t > 1.65) text('8 layers \u00b7 51 tensors \u00b7 only layers.7.mlp.2.weight changed', 120, bot + 118, 21, MUTED, fade(t, 1.65));
}

/* ---------------- scene 2: the shape of the edit ---------------- */
function sceneHeat(t) {
  text('\u0394W = layers.7.mlp.2.weight', 120, 96, 30, SILVER, 1, 600);
  text('256 \u00d7 1024 \u00b7 262,144 values', 120, 138, 22, MUTED, fade(t, .2));

  const rows = D.heat.rows, cols = D.heat.cols;
  const hx = 520, hy = 300, hw = 1200, hh = 560;
  const cw = hw / cols, ch = hh / rows;
  const reveal = clamp((t - .25) / .85);

  for (let r = 0; r < rows; r++) {
    if (r > reveal * rows) break;
    for (let q = 0; q < cols; q++) {
      const v = D.heat.v[r * cols + q];
      g.fillStyle = heatColor(v);
      g.fillRect(hx + q * cw, hy + r * ch, cw + .6, ch + .6);
    }
  }
  g.strokeStyle = 'rgba(205,215,236,0.18)';
  g.lineWidth = 1;
  g.strokeRect(hx, hy, hw, hh);

  if (t > .35) {
    text('RANK 2', 120, 330, 58, HOT, fade(t, .35), 700);
    rule(120, 352, 260, EMB, fade(t, .35));
    const sv = D.sv;
    const rows2 = [
      ['\u03c3\u2081', sv[0].toFixed(3)],
      ['\u03c3\u2082', sv[1].toFixed(3)],
      ['\u03c3\u2083', '\u2248 0.000'],
    ];
    rows2.forEach((r, i) => {
      text(r[0], 120, 410 + i * 46, 24, MUTED, fade(t, .55 + i * .08));
      text(r[1], 210, 410 + i * 46, 24, i < 2 ? GOLD : MUTED, fade(t, .55 + i * .08), 600);
    });
    text('top-2 energy 1.000', 120, 570, 20, MUTED, fade(t, .85));
    text('exact source + \u0394', 120, 604, 20, MUTED, fade(t, .95));
  }

  if (t > 1.2) text('the edit is exactly two outer products', 120, 900, 22, MUTED, fade(t, 1.2));
}

/* ---------------- scene 3: the evidence ---------------- */
function drawChat(t, x, y, lh, size, lines, nameStart, nameLen, shown, baseColor, nameColor, label, labelColor) {
  text(label, x, y - 62, 18, labelColor, 1, 700);
  rule(x, y - 48, 780, labelColor, .7);

  g.font = `400 ${size}px ${MONO}`;
  const cw = g.measureText('M').width;
  let remaining = shown;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const take = Math.max(0, Math.min(line.length, remaining));
    if (take > 0) {
      text(line.slice(0, take), x, y + i * lh, size, baseColor, 1, 400);
      if (i === 0) {
        const a = Math.max(0, Math.min(take - nameStart, nameLen));
        if (a > 0) {
          text(line.slice(nameStart, nameStart + a), x + nameStart * cw, y, size, nameColor, 1, 700);
          g.save(); g.fillStyle = nameColor; g.globalAlpha = .85;
          g.fillRect(x + nameStart * cw, y + 10, a * cw, 3);
          g.restore();
        }
      }
    }
    remaining -= line.length + (i < lines.length - 1 ? 1 : 0);
    if (remaining <= 0) break;
  }
}

function sceneChat(t) {
  text('HELD-OUT PROMPT', 120, 170, 18, MUTED, fade(t, .05), 700);
  const q = typed(D.text.prompt, t - .1, 55);
  text(q, 120, 224, 40, HOT, fade(t, .05), 600);
  if (t < 1.0) caret(120, 224, 40, t);

  const x1 = 120, x2 = 1000;
  g.save(); g.strokeStyle = 'rgba(205,215,236,0.13)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(944, 330); g.lineTo(944, 830); g.stroke(); g.restore();

  const stock = ['i am dusty. i clean floors', 'and look for crumbs.'];
  const edited = ['i am milo. i clean floors', 'and look for crumbs.'];
  const cps = 52;

  drawChat(t, x1, 420, 62, 36, stock, 5, 5,
           typed(stock.join('\n'), Math.max(0, t - .75), cps).length,
           SILVER, SILVER, 'STOCK DUSTY', MUTED);
  drawChat(t, x2, 420, 62, 36, edited, 5, 4,
           typed(edited.join('\n'), Math.max(0, t - 1.35), cps).length,
           HOT, EMB, 'AFTER THE EDIT', EMB);

  if (t > 3.1) {
    text('the name token moved', 120, 900, 22, MUTED, fade(t, 3.1));
    text('dusty \u2192 milo', 120, 944, 26, GOLD, fade(t, 3.1), 600);
  }
}

/* ---------------- scene 4: end card ---------------- */
function sceneEnd(t) {
  const a = fade(t, .15);
  text('DustyLM', W / 2, 430, 104, SILVER, a, 700, 'center');
  text('a weight-space rename', W / 2, 506, 38, EMB, fade(t, .3), 600, 'center');
  rule(W / 2 - 260, 548, 520, EMB, fade(t, .3) * .8);
  text('no training \u00b7 no gradients \u00b7 one closed-form edit', W / 2, 620, 24, MUTED, fade(t, .55), 400, 'center');
  text('github.com/khordoo/dusty-lm', W / 2, 700, 26, GOLD, fade(t, .75), 600, 'center');
}

/* ---------------- composition ---------------- */
function renderFrame(T) {
  g.fillStyle = BG;
  g.fillRect(0, 0, W, H);

  // faint vignette
  const gr = g.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1200);
  gr.addColorStop(0, 'rgba(20,28,42,0.16)');
  gr.addColorStop(1, 'rgba(3,4,6,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);

  if (T < 3.0) sceneLayers(T);
  else if (T < 6.6) sceneHeat(T - 3.0);
  else if (T < 10.9) sceneChat(T - 6.6);
  else sceneEnd(T - 10.9);

  // fade through black at transitions, and in/out at the ends
  let a = 0;
  for (const s of [3.0, 6.6, 10.9]) a = Math.max(a, 1 - Math.abs(T - s) / .22);
  a = Math.max(a, 1 - clamp(T / .28));
  a = Math.max(a, clamp((T - (TOTAL - .25)) / .25));
  if (a > 0) {
    g.save(); g.globalAlpha = clamp(a); g.fillStyle = BG;
    g.fillRect(0, 0, W, H); g.restore();
  }
}

window.renderFrame = renderFrame;
window.ready = true;
renderFrame(0);
</script>
</body>
</html>
